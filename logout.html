<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الخروج | DIGITAL DRAGON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <main class="auth-main">
        <section class="auth-panel" aria-live="polite">
            <div id="logout-status" class="auth-message">جارٍ تسجيل الخروج...</div>
        </section>
    </main>

    <script>
        const status = document.getElementById("logout-status");

        try {
            localStorage.removeItem("digital-dragon-user");
            status.textContent = "تم تسجيل الخروج بنجاح. جارٍ تحويلك إلى الصفحة الرئيسية...";
        } catch (error) {
            status.textContent = "حدث خطأ أثناء تسجيل الخروج.";
        }

        setTimeout(function () {
            window.location.replace("index.html");
        }, 700);
    </script>
    <!-- زر تواصل معنا -->
<a href="contact us.html" class="contact-button">
    تواصل معنا
</a>
<!-- أيقونة واتساب -->
<div class="whatsapp-button">
    <i class="fab fa-whatsapp"></i>
</div>

</body>

</html>
