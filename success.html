<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تم الإرسال</title>
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #f5f7ff, #eef2ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      color: #1f2937;
    }

    .success-box {
      background: #fff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      max-width: 500px;
      width: 90%;
    }

    .icon {
      font-size: 60px;
      color: #22c55e;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #111827;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
      color: #4b5563;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      transition: 0.3s ease;
    }

    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="success-box">
    <div class="icon">✓</div>
    <h1>تم إرسال الرسالة بنجاح</h1>
    <p>شكرًا لك، تم استلام رسالتك وسنتواصل معك في أقرب وقت ممكن.</p>
    <a href="index.html" class="btn">العودة إلى الصفحة الرئيسية</a>
  </div>
</body>
</html>
